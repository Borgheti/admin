# Sandbox dev config. The app is a single file named `admin` with no extension,
# so `default_type text/html` is what makes the browser render it instead of
# downloading it. `index admin` serves it at `/`, and `try_files ... /admin`
# serves it for any other path. Caching is off so source edits show immediately.
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index admin;

    default_type text/html;
    charset utf-8;

    add_header Cache-Control "no-store, no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /admin;
    }

    # The whole repo is bind-mounted; never expose its plumbing (.git etc.).
    location ~ /\. {
        deny all;
    }
}
